name: ci

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install clang
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang

      - name: Run eBPF C checks
        run: make test-ebpf-c

      - name: Regenerate eBPF bindings
        run: go generate ./internal/ebpf

      - name: Run tests
        run: go test ./...

      - name: Run race tests
        run: go test -race ./...

      - name: Run eBPF kernel integration tests
        run: |
          integration_cache_root=$(sudo mktemp -d /tmp/traceguard-ebpf-integration.XXXXXX)
          trap 'sudo rm -rf "$integration_cache_root"' EXIT
          set +e
          sudo env "GOMODCACHE=$integration_cache_root/gomod" "GOCACHE=$integration_cache_root/gocache" \
            "$(command -v go)" test -tags ebpfintegration ./internal/ebpf 2>&1 | tee ebpf-integration.log
          status=${PIPESTATUS[0]}
          set -e
          if (( status != 0 )); then
            while IFS= read -r line; do
              line=${line//'%'/'%25'}
              line=${line//$'\r'/'%0D'}
              line=${line//$'\n'/'%0A'}
              printf '::error title=eBPF integration::%s\n' "$line"
            done < <(tail -n 15 ebpf-integration.log)
            exit "$status"
          fi

      - name: Build traceguard
        run: go build ./cmd/traceguard
