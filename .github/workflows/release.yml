name: release

on:
  push:
    tags:
      - "v*"
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name || github.run_id }}
  cancel-in-progress: true

jobs:
  packages:
    name: Build Release Packages
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Clang cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Configure cgo cross compiler
        run: |
          umask 077
          cat > "${RUNNER_TEMP}/traceguard-clang" <<'EOF'
          #!/usr/bin/env sh
          set -eu

          case "${GOOS:-}/${GOARCH:-}" in
            linux/amd64)
              exec /usr/bin/clang "$@"
              ;;
            linux/arm64)
              exec /usr/bin/clang --target=aarch64-linux-gnu --gcc-toolchain=/usr "$@"
              ;;
            *)
              echo "unsupported cgo target: GOOS=${GOOS:-} GOARCH=${GOARCH:-}" >&2
              exit 1
              ;;
          esac
          EOF
          chmod +x "${RUNNER_TEMP}/traceguard-clang"
          GOOS=linux GOARCH=amd64 "${RUNNER_TEMP}/traceguard-clang" --version
          printf 'int main(void) { return 0; }\n' > "${RUNNER_TEMP}/traceguard-arm64-smoke.c"
          GOOS=linux GOARCH=arm64 "${RUNNER_TEMP}/traceguard-clang" "${RUNNER_TEMP}/traceguard-arm64-smoke.c" -o "${RUNNER_TEMP}/traceguard-arm64-smoke"

      - name: Run eBPF C checks
        run: make test-ebpf-c

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CC: ${{ runner.temp }}/traceguard-clang
