name: release

on:
  push:
    tags:
      - "v*"
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name || github.run_id }}
  cancel-in-progress: true

jobs:
  packages:
    name: Build Release Packages
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install Clang cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Configure cgo cross compiler
        run: |
          umask 077
          cat > "${RUNNER_TEMP}/traceguard-clang" <<'EOF'
          #!/usr/bin/env sh
          set -eu

          case "${GOOS:-}/${GOARCH:-}" in
            linux/amd64)
              exec /usr/bin/clang "$@"
              ;;
            linux/arm64)
              exec /usr/bin/clang --target=aarch64-linux-gnu --gcc-toolchain=/usr "$@"
              ;;
            *)
              echo "unsupported cgo target: GOOS=${GOOS:-} GOARCH=${GOARCH:-}" >&2
              exit 1
              ;;
          esac
          EOF
          chmod +x "${RUNNER_TEMP}/traceguard-clang"
          GOOS=linux GOARCH=amd64 "${RUNNER_TEMP}/traceguard-clang" --version
          printf 'int main(void) { return 0; }\n' > "${RUNNER_TEMP}/traceguard-arm64-smoke.c"
          GOOS=linux GOARCH=arm64 "${RUNNER_TEMP}/traceguard-clang" "${RUNNER_TEMP}/traceguard-arm64-smoke.c" -o "${RUNNER_TEMP}/traceguard-arm64-smoke"

      - name: Run eBPF C checks
        run: make test-ebpf-c

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CC: ${{ runner.temp }}/traceguard-clang
