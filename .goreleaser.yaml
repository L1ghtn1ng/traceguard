version: 2

project_name: traceguard

before:
  hooks:
    - go mod tidy
    - go generate ./internal/ebpf
    - go test ./...

builds:
  - id: traceguard
    main: ./cmd/traceguard
    binary: traceguard
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=1
      - CGO_CFLAGS=-O2 -flto -D_FORTIFY_SOURCE=2 -fstack-protector-all -fPIE
      - CGO_LDFLAGS=-flto -Wl,-z,relro,-z,now -Wl,-z,noexecstack -pie
    flags:
      - -trimpath
      - -buildmode=pie
    ldflags:
      - -s -w -linkmode=external -extldflags "-flto -Wl,-z,relro,-z,now -Wl,-z,noexecstack -pie"

archives:
  - ids:
      - traceguard
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - packaging/systemd/traceguard.service
      - packaging/default/traceguard.env
      - examples/policy.yaml
      - docs/policy.schema.json

checksum:
  name_template: checksums.txt

sboms:
  - id: archive
    artifacts: archive

nfpms:
  - id: traceguard-packages
    ids:
      - traceguard
    package_name: traceguard
    file_name_template: "{{ .ConventionalFileName }}"
    formats:
      - deb
      - rpm
      - archlinux
    description: |
      TraceGuard observes Linux runtime activity with eBPF and enforces DNS and
      UID/cgroup-aware outbound policy from legacy or strict YAML sources.
    license: MIT
    maintainer: TraceGuard Maintainers <maintainers@example.invalid>
    section: admin
    priority: optional
    bindir: /usr/bin
    contents:
      - src: packaging/systemd/traceguard.service
        dst: '{{ if eq .Format "deb" }}/lib/systemd/system/traceguard.service{{ else }}/usr/lib/systemd/system/traceguard.service{{ end }}'
      - src: packaging/default/traceguard.env
        dst: /etc/traceguard/traceguard.env
        type: config|noreplace
      - src: README.md
        dst: /usr/share/doc/traceguard/README.md
      - src: examples/policy.yaml
        dst: /usr/share/doc/traceguard/policy.example.yaml
      - src: docs/policy.schema.json
        dst: /usr/share/doc/traceguard/policy.schema.json
      - src: LICENSE
        dst: /usr/share/licenses/traceguard/LICENSE

snapshot:
  version_template: "{{ incpatch .Version }}-next"
