# TraceGuard policy v1 example.
#
# This file uses example domains and documentation-only IP ranges. Adjust every
# value for your environment and start with `-dry-run` before enabling `-block`.

version: 1

# The baseline detection profile is enabled by default. Listing it makes that
# choice explicit. See docs/policy.md for the built-in rule IDs.
builtin_profiles:
  - baseline

# IDs in this list are removed after remote and local policies are merged. It
# can disable an egress, exec, file, bind, unix, sockopt, custom detection, or
# built-in detection rule.
# disabled_rule_ids:
#   - baseline.policy-denial-burst
#   - remote-rule-that-is-not-needed-on-this-host

dns:
  block:
    # Exact domain.
    - malware.example

    # Suffix forms are equivalent. They match the base domain and subdomains.
    - "*.tracking.example"
    - suffix:telemetry.example

    # Explicit encrypted DNS resolver endpoints.
    - https://192.0.2.53:8443/dns-query
    - dot://[2001:db8::53]:8853

    # A bare IP or CIDR covers both DoH on port 443 and DoT on port 853.
    - 203.0.113.53
    - 2001:db8:100::/48

    # Quote "*" because YAML otherwise treats it as an alias marker. This
    # blocks every DNS name and encrypted resolver unless an allow rule wins.
    # - "*"

  allow:
    # Exact allow overrides the tracking.example suffix block for this name.
    - updates.tracking.example

    # Allow a trusted domain and all of its subdomains.
    - "*.corp.example"

    # Resolver allow rules also override broader resolver blocks.
    - https://192.0.2.10/dns-query
    - dot://[2001:db8::10]
    - 198.51.100.0/24

egress:
  # Keep unmatched traffic allowed while introducing policy. Change this to
  # block only after the allow rules have been exercised in dry-run mode.
  default: allow

  rules:
    # Protect the cloud instance metadata endpoint for every workload.
    - id: block-cloud-metadata
      action: block
      destinations:
        cidrs:
          - 169.254.169.254/32
        ports:
          - 80
        protocols:
          - tcp

    # Block direct SMTP from every workload. Omitting selectors makes the rule
    # global; omitting CIDRs makes it apply to every IPv4 and IPv6 destination.
    - id: block-direct-smtp
      action: block
      destinations:
        ports:
          - 25
          - 465
          - 587
        protocols:
          - tcp

    # Restrict a batch workload from reaching arbitrary networks.
    - id: block-batch-internet
      action: block
      selectors:
        uids:
          - 2000
      destinations:
        cidrs:
          - 0.0.0.0/0
          - ::/0

    # Explicit allows win over the broader block-batch-internet rule.
    - id: allow-batch-dns
      action: allow
      selectors:
        uids:
          - 2000
      destinations:
        cidrs:
          - 192.0.2.10/32
          - 2001:db8::10/128
        ports:
          - 53
        protocols:
          - tcp
          - udp

    - id: allow-batch-api
      action: allow
      selectors:
        uids:
          - 2000
      destinations:
        cidrs:
          - 198.51.100.20/32
        ports:
          - 443
        protocols:
          - tcp

    # Values inside the UID list are alternatives. Cgroup selectors are
    # reserved for fail-closed allow exceptions in block and dry-run modes.
    - id: block-service-admin-network
      action: block
      selectors:
        uids:
          - 1001
          - 1002
      destinations:
        cidrs:
          - 10.20.0.0/16
          - 2001:db8:20::/48
        ports:
          - 22
          - 3389
        protocols:
          - tcp

# The following enforcement sections are intentionally commented out. Test
# explicit block rules with `-dry-run` before enabling `-block`. Exec and file
# use host-wide BPF LSM hooks and therefore require the root cgroup path.
#
# exec:
#   default: allow
#   rules:
#     - id: block-shared-memory-exec
#       action: block
#       selectors:
#         uids: [1000]
#       match:
#         path_globs: [/tmp/**, /dev/shm/**, /run/shm/**]
#
# file:
#   default: allow
#   rules:
#     - id: block-sensitive-auth-write
#       action: block
#       match:
#         path_globs: [/etc/shadow, /etc/sudoers, /etc/sudoers.d/**, /root/.ssh/**]
#         access: [write]
#
# bind:
#   default: allow
#   rules:
#     - id: block-workload-ssh-bind
#       action: block
#       selectors:
#         uids: [2000]
#       endpoints:
#         cidrs: [0.0.0.0/0, "::/0"]
#         ports: [22]
#         protocols: [tcp]
#
# unix:
#   default: allow
#   rules:
#     - id: block-docker-socket
#       action: block
#       match:
#         path_globs: [/var/run/docker.sock]
#         operations: [connect, sendmsg]
#
# sockopt:
#   default: allow
#   rules:
#     - id: block-socket-mark
#       action: block
#       match:
#         levels: [socket]
#         optnames: [so_mark, so_reuseport]

detections:
  # Alert after three metadata connection attempts by the same cgroup and
  # executable within one minute. Root-owned activity is excluded.
  - id: repeated-metadata-access
    severity: warning
    events:
      - connection
    match:
      directions:
        - outbound
      destination_cidrs:
        - 169.254.169.254/32
      ports:
        - 80
    exclude:
      uids:
        - 0
    threshold:
      count: 3
      within: 1m
      group_by:
        - cgroup
        - executable
    cooldown: 5m
    message: repeated access to the cloud metadata endpoint
    tags:
      - cloud
      - credential-access

  # Resolved paths are available on LSM enforcement decisions. Syscall exec
  # events expose only the requested alias and cannot use path selectors.
  - id: execution-from-temporary-directory
    severity: warning
    events:
      - exec_blocked
      - exec_would_block
    match:
      executable_globs:
        - /tmp/**
        - /var/tmp/**
    cooldown: 5m
    message: process executed from a temporary directory
    tags:
      - execution
      - suspicious-path

  # Detect egress denials generated in either enforcement or dry-run mode,
  # grouped by the event-time kernel cgroup ID.
  - id: repeated-egress-denials
    severity: notice
    events:
      - egress_blocked
      - egress_would_block
    match:
      directions:
        - outbound
    threshold:
      count: 5
      within: 2m
      group_by:
        - cgroup
        - destination
    cooldown: 10m
    message: a workload repeatedly attempted disallowed egress
    tags:
      - egress
      - policy

  # Canonical file paths are available on LSM enforcement decisions.
  - id: ssh-configuration-write
    severity: error
    events:
      - file_blocked
      - file_would_block
    match:
      file_path_globs:
        - /etc/ssh/**
      file_access:
        - write
    cooldown: 5m
    message: SSH configuration was opened for writing
    tags:
      - persistence
      - configuration

  # Inbound TCP connection events are emitted once per received SYN. ports
  # matches the remote peer port, so the listening port is local_ports. This
  # tightens baseline.inbound-ssh-bruteforce for an SSH service on port 2222.
  - id: inbound-ssh-bruteforce-alt-port
    severity: warning
    events:
      - connection
    match:
      directions:
        - inbound
      protocols:
        - tcp
      local_ports:
        - 2222
    threshold:
      count: 10
      within: 1m
      group_by:
        - peer
    cooldown: 10m
    message: a remote address opened repeated SSH connections
    tags:
      - ssh
      - brute-force

  # Bind decisions carry the requested local address and port.
  - id: privileged-port-bind-denied
    severity: warning
    events:
      - bind_blocked
      - bind_would_block
    match:
      local_ports:
        - 22
        - 80
        - 443
    cooldown: 5m
    message: a process attempted to bind a privileged service port
    tags:
      - persistence
      - network

  # Unix socket decisions carry the requested socket path. Abstract socket
  # names start with @.
  - id: container-runtime-socket-denied
    severity: error
    events:
      - unix_blocked
      - unix_would_block
    match:
      unix_path_globs:
        - /var/run/docker.sock
        - /run/docker.sock
        - /run/containerd/**
    cooldown: 5m
    message: a process attempted to reach a container runtime socket
    tags:
      - privilege-escalation
      - container

  # A disabled rule only needs an ID and enabled: false. This is useful when a
  # local overlay temporarily turns off a remote custom detection by ID.
  - id: experimental-disabled-rule
    enabled: false
